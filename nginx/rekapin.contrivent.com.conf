map $http_upgrade $rekapinConnectionUpgrade {
    default upgrade;
    ''      close;
}

map $http_user_agent $rekapinIsBot {
    default 0;
    "~*(googlebot|bingbot|slurp|baiduspider|facebookexternalhit|twitterbot|linkedinbot|pinterestbot|slackbot|whatsapp|telegrambot|discordbot|applebot|petalbot|yandexbot|bytespider|semrushbot|ai2bot)" 1;
}

server {
    listen 80;
    server_name pinote.contrivent.com;
    return 301 https://rekapin.contrivent.com$request_uri;
}

server {
    listen 80;
    server_name rekapin.contrivent.com;
    client_max_body_size 250M;
    root /var/www/pinote/frontend/dist;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rekapinConnectionUpgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /share/ {
        if ($rekapinIsBot) {
            proxy_pass http://127.0.0.1:3000;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /api/health {
        rewrite ^ /health break;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/health/live {
        rewrite ^ /health/live break;
        proxy_pass http://127.0.0.1:3000;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
